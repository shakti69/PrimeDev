<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="primedev-favicon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FF5819" />
      <stop offset="100%" stopColor="#D93D00" />
    </linearGradient>
    <filter id="primedev-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  {/* Background Pill / Squircle */}
  <rect width="64" height="64" rx="18" fill="url(#primedev-favicon-grad)" />

  {/* Inner Glow Border */}
  <rect x="1" y="1" width="62" height="62" rx="17" stroke="rgba(255,255,255,0.25)" stroke-width="2" />

  {/* PrimeDev Signature Geometric Monogram 'P' */}
  <g transform="translate(19, 13)" fill="#FFFFFF" filter="url(#primedev-shadow)">
    {/* Stem */}
    <rect x="0" y="0" width="8" height="38" rx="2" />
    {/* Loop */}
    <path
      fillRule="evenodd"
      clipRule="evenodd"
      d="M 8 0 L 20 0 C 24.418 0 28 3.582 28 8 L 28 16 C 28 20.418 24.418 24 20 24 L 8 24 Z M 8 7 L 18.5 7 C 20.433 7 22 8.567 22 10.5 L 22 13.5 C 22 15.433 20.433 17 18.5 17 L 8 17 Z"
    />
  </g>
</svg>